name: Temporary active-reaffirmation rustfmt
on:
  push:
    branches: [fix/active-reaffirmation-semantics]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Format Rust code
        run: cargo fmt --all
      - name: Commit formatting on PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u '*.rs'
          git add tests/active_reaffirmation.rs
          if ! git diff --cached --quiet; then
            git commit -m "style: format generic reaffirmation relationship guard"
            git push origin HEAD:fix/active-reaffirmation-semantics
          fi
