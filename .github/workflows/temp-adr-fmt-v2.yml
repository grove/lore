name: Temporary ADR reconciliation rustfmt
on:
  push:
    branches: [fix/adr-acceptance-noop-status]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Format
        run: cargo fmt --all
      - name: Commit formatted Rust
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u '*.rs'
          if ! git diff --cached --quiet; then
            git commit -m "style: format evidence-scoped ADR relationship detector"
            git push origin "HEAD:fix/adr-acceptance-noop-status"
          fi
