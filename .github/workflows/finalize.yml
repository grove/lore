# Temporary, narrowly scoped implementation finalization. Removed before merge.
name: Finalize tested compiler sources
on:
  push:
    branches: [feat/knowledge-compiler]
permissions:
  contents: write
jobs:
  finalize:
    if: >-
      github.repository == 'grove/lore' && github.event.head_commit.message == 'chore: finalize validated compiler sources'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply reviewed hardening and run all tests
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "27f3da25fecd54b45bb5348135fb04292cec5614"
          cargo fmt --all
          git apply --check .github/lore-code.patch
          git apply .github/lore-code.patch
          cargo fmt --all
          cargo generate-lockfile
          cargo test --all-targets --locked
          cargo run --locked -- --help
          cargo run --locked -- --version
      - name: Commit tested sources to the implementation branch only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/feat/knowledge-compiler | cut -f1)" = "$EXPECTED_HEAD"
          git rm .github/lore-code.patch
          git add Cargo.lock src tests docs examples README.md DESIGN.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: harden compiler boundaries and lock tested dependencies'
          git push origin HEAD:refs/heads/feat/knowledge-compiler
