name: Guardian source integrity
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guardian-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record source and toolchain versions
        run: |
          git rev-parse HEAD
          rustc --version --verbose
          cargo --version
          python3 --version
      - name: Allocate dedicated runner storage and freeze source identities
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/lore-08-guardian"
          mkdir -m 700 "$root"
          mkdir "$root/binaries"
          echo "LORE_GUARDIAN_ROOT=$root" >> "$GITHUB_ENV"
          echo "LORE_GUARDIAN_BASELINE_REVISION=0ba8b17f7e63726a8d81def2b60af18573d4640c" >> "$GITHUB_ENV"
          echo "LORE_GUARDIAN_CANDIDATE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git worktree add --detach "$root/baseline-source" 0ba8b17f7e63726a8d81def2b60af18573d4640c
      - name: Prepare exact synthetic sources without inference
        run: python3 evaluation/guardian_longitudinal.py prepare --output "$LORE_GUARDIAN_ROOT/prepared"
      - name: Build pinned 0.7 baseline and export its immutable retained history
        shell: bash
        env:
          LORE_GUARDIAN_PREPARED: ${{ runner.temp }}/lore-08-guardian/prepared
          LORE_GUARDIAN_COMPILED: ${{ runner.temp }}/lore-08-guardian/compiled
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path "$LORE_GUARDIAN_ROOT/baseline-source/Cargo.toml" --target-dir "$LORE_GUARDIAN_ROOT/baseline-target"
          cp "$LORE_GUARDIAN_ROOT/baseline-target/debug/lore" "$LORE_GUARDIAN_ROOT/binaries/lore-baseline"
          cargo test --locked --manifest-path "$LORE_GUARDIAN_ROOT/baseline-source/Cargo.toml" --target-dir "$LORE_GUARDIAN_ROOT/baseline-target" --test guardian_corpus_export -- --nocapture
      - name: Build and freeze candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --target-dir "$LORE_GUARDIAN_ROOT/candidate-target"
          cp "$LORE_GUARDIAN_ROOT/candidate-target/debug/lore" "$LORE_GUARDIAN_ROOT/binaries/lore-candidate"
      - name: Enforce every event and command source-integrity gate
        run: |
          python3 evaluation/guardian_integrity_gate.py \
            --prepared "$LORE_GUARDIAN_ROOT/prepared" \
            --compiled "$LORE_GUARDIAN_ROOT/compiled" \
            --baseline-binary "$LORE_GUARDIAN_ROOT/binaries/lore-baseline" \
            --candidate-binary "$LORE_GUARDIAN_ROOT/binaries/lore-candidate" \
            --baseline-revision "$LORE_GUARDIAN_BASELINE_REVISION" \
            --candidate-revision "$LORE_GUARDIAN_CANDIDATE_REVISION" \
            --output "$LORE_GUARDIAN_ROOT/replays"
      - name: Retain hash-bound captures, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guardian-source-integrity-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/lore-08-guardian/replays/receipt.json
            ${{ runner.temp }}/lore-08-guardian/replays/guardian-integrity-evidence.zip
          if-no-files-found: warn
          retention-days: 30
