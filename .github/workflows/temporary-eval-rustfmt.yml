name: Temporary Rust formatting on review branch
on:
  push:
    branches: [fix/timeline-reconciliation-evaluation]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Format Rust source
        run: cargo fmt --all
      - name: Commit formatting to review branch only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u '*.rs'
          git add 'src/engine/timeline.rs' 'tests/temporal_consistency.rs'
          if ! git diff --cached --quiet; then
            git commit -m "style: format timeline and reconciliation changes"
            git push origin "HEAD:fix/timeline-reconciliation-evaluation"
          fi
