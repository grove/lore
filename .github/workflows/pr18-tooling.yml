name: PR18 tooling export (temporary)
on:
  push:
    branches: [fix/evidence-complete-synthesis]
permissions:
  contents: read
jobs:
  export:
    if: github.repository == 'grove/lore'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Fetch locked public Rust dependencies
        run: cargo fetch --locked
      - name: Export source and isolated tools (no credentials or configuration)
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr18-tools/bin /tmp/pr18-tools/lib/rustlib /tmp/pr18-tools/source /tmp/pr18-tools/cargo/registry
          git archive HEAD | tar -x -C /tmp/pr18-tools/source
          for binary in rustfmt rustc cargo; do cp "$(rustup which "$binary")" /tmp/pr18-tools/bin/; done
          sysroot="$(rustc --print sysroot)"
          find "$sysroot/lib" -maxdepth 1 -type f -name '*.so*' -exec cp {} /tmp/pr18-tools/lib/ \;
          cp -a "$sysroot/lib/rustlib/x86_64-unknown-linux-gnu" /tmp/pr18-tools/lib/rustlib/
          for part in cache index src; do cp -a "$HOME/.cargo/registry/$part" /tmp/pr18-tools/cargo/registry/; done
          cd /tmp/pr18-tools
          tar -czf /tmp/pr18-tooling.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr18-offline-tools
          path: /tmp/pr18-tooling.tar.gz
          retention-days: 1
