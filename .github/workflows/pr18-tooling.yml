name: Import locally validated PR18 changes (temporary)
on:
  push:
    branches: [fix/evidence-complete-synthesis]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'grove/lore' && github.ref == 'refs/heads/fix/evidence-complete-synthesis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate and import the exact locally tested source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = ''.join(Path(f'.github/pr18.patch.part{i}').read_text() for i in range(5))
          data = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == '773eb04422f301b4a72c830f1dc78a6952da57c730f14a7c4694a3c072f06460', 'Patch content mismatch'
          Path('/tmp/pr18-validated.patch').write_bytes(data)
          PY
          rustfmt --edition 2024 src/lib.rs src/main.rs tests/*.rs
          git add src tests
          git apply --index /tmp/pr18-validated.patch
          rustfmt --edition 2024 --check src/lib.rs src/main.rs tests/*.rs
          git diff --cached --check
          cp .git/index /tmp/pr18-verified-index
          GIT_INDEX_FILE=/tmp/pr18-verified-index git update-index --force-remove .github/workflows/pr18-tooling.yml .github/pr18.patch.part0 .github/pr18.patch.part1 .github/pr18.patch.part2 .github/pr18.patch.part3 .github/pr18.patch.part4
          final_tree=$(GIT_INDEX_FILE=/tmp/pr18-verified-index git write-tree)
          test "$final_tree" = '396a982fda5f045f16ac30494d1da97757618714'
          test "$(git ls-remote origin refs/heads/fix/evidence-complete-synthesis | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: finish locally validated witness scoring and citation-complete repair'
          git push origin HEAD:refs/heads/fix/evidence-complete-synthesis
          echo "Verified final source tree: $final_tree; temporary import files are removed separately before normal CI."
