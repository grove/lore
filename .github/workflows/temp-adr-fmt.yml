name: Temporary ADR status formatter
on:
  push:
    branches: [fix/adr-acceptance-noop-status]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Format changed Rust source
        run: cargo fmt --all
      - name: Commit formatting to review branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u '*.rs'
          git add tests/adr_metadata.rs
          if ! git diff --cached --quiet; then
            git commit -m "style: format ADR metadata and persistent quality reporting"
            git push origin "HEAD:fix/adr-acceptance-noop-status"
          fi
