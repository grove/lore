name: Temporary formatting for PR 7
on:
  push:
    branches: [fix/explicit-document-decision-links]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Format Rust source
        run: cargo fmt --all
      - name: Commit formatting to review branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u '*.rs'
          git add 'tests/explicit_decisions.rs'
          if ! git diff --cached --quiet; then
            git commit -m "style: format source-anchored decision tests"
            git push origin "HEAD:fix/explicit-document-decision-links"
          fi
