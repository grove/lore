name: V02 workbench
on:
  push:
    branches: [feat/v02-knowledge-quality]
permissions:
  contents: write
jobs:
  workbench:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Apply assertion-checked refactoring
        run: |
          if test -f scripts/_v02_apply.py; then
            python scripts/_v02_apply.py
            rm scripts/_v02_apply.py
          fi
          cargo fmt --all
      - name: Commit source changes on this isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if ! git diff --cached --quiet; then
            git commit -m 'feat: apply classification and evidence-bound review workflow'
            git push origin HEAD:feat/v02-knowledge-quality
          fi
      - name: Offline Rust tests
        run: cargo test --all-targets --locked -- --nocapture
      - name: Python evaluation tests
        run: python -m unittest discover -s evaluation/tests -v
      - name: Source snapshot
        if: always()
        run: git archive --format=tar.gz HEAD > /tmp/lore-v02-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lore-v02-source
          path: /tmp/lore-v02-source.tar.gz
          retention-days: 2
