name: Citation contract workbench
on:
  push:
    branches: [fix/scoped-overview-citations]
permissions:
  contents: write
jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Apply checked source changes and format
        run: |
          if test -f scripts/_citation_fix.py; then
            python scripts/_citation_fix.py
            rm scripts/_citation_fix.py
          fi
          cargo fmt --all
      - name: Commit source changes on isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u src tests scripts
          if ! git diff --cached --quiet; then
            git commit -m 'fix: scope citations to supplied knowledge and retain decision evidence'
            git push origin HEAD:fix/scoped-overview-citations
          fi
      - name: Offline Rust tests
        run: cargo test --all-targets --locked
      - name: Offline evaluation tests
        run: python -m unittest discover -s evaluation/tests -v
