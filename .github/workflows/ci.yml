name: Lore tests
on:
  push:
    branches: [main, feat/knowledge-compiler]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run offline tests
        run: cargo test --all-targets
      - name: CLI smoke tests
        run: |
          cargo run -- --help
          cargo run -- --version
