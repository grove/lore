name: Lore tests
on:
  push:
    branches: [main, feat/knowledge-compiler, evaluation/validation-benchmark]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build and run offline Rust tests
        run: cargo test --all-targets --locked
      - name: Benchmark harness tests (no inference)
        run: python -m unittest discover -s evaluation/tests -v
      - name: CLI help
        run: cargo run --locked -- --help
      - name: CLI version
        run: cargo run --locked -- --version
