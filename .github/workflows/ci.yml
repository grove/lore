name: Lore tests
on:
  push:
    branches: [main, feat/knowledge-compiler]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run offline tests
        run: cargo test --all-targets
      - name: CLI smoke tests
        run: |
          cargo run -- --help
          cargo run -- --version
      - name: Prepare reproducible source snapshot
        if: always()
        run: |
          cargo fmt --all
          tar --exclude=.git --exclude=target -czf /tmp/lore-source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lore-source
          path: /tmp/lore-source.tar.gz
          retention-days: 7
