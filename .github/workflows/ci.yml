name: Lore tests
on:
  push:
    branches: [main, feat/knowledge-compiler, evaluation/validation-benchmark]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Build and run offline Rust tests
        run: cargo test --all-targets --locked
      - name: Benchmark and assessment tests (no inference)
        run: python -m unittest discover -s evaluation/tests -v
      - name: Prepare validation corpora (no inference)
        if: runner.os == 'Linux'
        run: |
          python evaluation/suite.py prepare --output /tmp/lore-v02-corpora
          python evaluation/benchmark.py prepare --target llm-wiki --output /tmp/lore-eval-llm-wiki
          python evaluation/cross_source.py prepare --output /tmp/lore-v04-cross-source
          python evaluation/coding_tasks.py prepare --output /tmp/lore-v05-coding
      - name: CLI help
        run: cargo run --locked -- --help
      - name: Review CLI help
        run: cargo run --locked -- review --help
      - name: CLI version
        run: cargo run --locked -- --version
