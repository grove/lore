name: Temporary chronology rustfmt
on:
  push:
    branches: [fix/verified-topic-chronology]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Format all Rust changes
        run: cargo fmt --all
      - name: Commit formatting to isolated branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u '*.rs'
          git add tests/chronology_rendering.rs
          if ! git diff --cached --quiet; then
            git commit -m "style: format verified chronology and source fallback changes"
            git push origin "HEAD:fix/verified-topic-chronology"
          fi
