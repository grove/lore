# Explicit hosted opt-in. Relevant project excerpts will be sent to OpenAI.
# This example uses GPT-6 Luna for Responses and Decisions. Set OPENAI_API_KEY.
schema_version: 1
project:
  name: my-project
sources:
  roots:
    - id: docs
      path: ./docs
privacy:
  local_only: false
models:
  generative:
    provider: openai
    model: gpt-6-luna
  decision:
    provider: openai
    model: gpt-6-luna
  # Responses API only; OpenAI Decisions ignores these settings.
  reasoning:
    enabled: true
    default: medium
    extraction: low
    reconciliation: high
    synthesis: medium
    overview: medium
    verification: high
    overview_verification: high
    context_synthesis: medium
    context_verification: high
providers:
  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
